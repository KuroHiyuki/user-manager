name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm test
    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build

    publish:
        needs: [backend, frontend]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                service: [backend, frontend]
        steps:
            - uses: actions/checkout@v5
            - name: Set image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v7
              with:
                  context: ./${{ matrix.service }}
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
    deploy:
        needs: publish
        if: ${{ vars.DEPLOY_GCP_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      cd ~/user-manager
                      COMPOSE="docker compose -f docker-compose.prod.yml"
                      PREV=$(cat .last_good_tag 2>/dev/null || true)
                      export TAG=${{ github.sha }}

                      $COMPOSE pull
                      $COMPOSE up -d --remove-orphans || echo "compose up báo lỗi, kiểm tra health"

                      for i in $(seq 1 15); do
                        if curl -fsS http://localhost/api/health > /dev/null; then
                          echo "$TAG" > .last_good_tag
                          echo "Deploy OK: $TAG"
                          exit 0
                        fi
                        sleep 2
                      done

                      echo "Health check lỗi"
                      if [ -n "$PREV" ]; then
                        export TAG=$PREV
                        $COMPOSE up -d
                        echo "Đã rollback về $PREV"
                      fi
                      exit 1
    deploy-home:
        needs: publish
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        runs-on: [self-hosted, home]
        environment: production
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
            - name: Đặt IMAGE_PREFIX bằng chữ thường
              run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Deploy và kiểm tra health
              run: |
                  set -e
                  COMPOSE="docker compose -p user-manager -f docker-compose.prod.yml"
                  PREV=$(cat ~/.last_good_tag 2>/dev/null || true)
                  export TAG=${{ github.sha }}

                  $COMPOSE pull
                  $COMPOSE up -d --remove-orphans || echo "compose up báo lỗi, kiểm tra health"

                  for i in $(seq 1 15); do
                    if curl -fsS http://localhost/api/health > /dev/null; then
                      echo "$TAG" > ~/.last_good_tag
                      echo "Deploy OK: $TAG"
                      exit 0
                    fi
                    sleep 2
                  done

                  echo "Health check lỗi"
                  if [ -n "$PREV" ]; then
                    export TAG=$PREV
                    $COMPOSE up -d
                    echo "Đã rollback về $PREV"
                  fi
                  exit 1
