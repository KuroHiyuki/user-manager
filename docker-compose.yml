services:
  backend:
    build: ./backend
    restart: unless-stopped
    # ports:
    #   - "3000:3000" - chỉ mở port backend ra ngoài container khi cần
    volumes:
      - user-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  user-data: